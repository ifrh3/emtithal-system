<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تقارير الفحص الآلي — امتثال</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/emtithal_components.css">

  <style>
    :root {
      --brand-50: #F3FCF6;
      --brand-100: #E0F5EA;
      --brand-200: #B8E6CB;
      --brand-500: #1B8354;
      --brand-600: #15683F;
      --brand-700: #067647;

      --indigo-50: #F5F3FA;
      --indigo-100: #ECE8F4;
      --indigo-500: #4E3B86;
      --indigo-700: #303074;

      --danger-50: #FEF3F2;
      --danger-100: #FECDCA;
      --danger-500: #D92D20;
      --danger-600: #B42318;

      --warning-50: #FFFAEB;
      --warning-100: #FEF0C7;
      --warning-500: #F79009;

      --success-50: #F3FCF6;
      --success-100: #DCFAE6;
      --success-500: #12B76A;

      --neutral-0: #FFFFFF;
      --neutral-25: #FCFCFD;
      --neutral-50: #F9FAFB;
      --neutral-100: #F3F4F6;
      --neutral-200: #E5E7EB;
      --neutral-300: #D2D6DB;
      --neutral-400: #9DA4AE;
      --neutral-500: #6C737F;
      --neutral-600: #4D5761;
      --neutral-700: #384250;
      --neutral-900: #161616;

      --shadow-sm: 0 1px 2px 0 rgb(16 24 40 / 0.06), 0 1px 3px 0 rgb(16 24 40 / 0.10);
      --shadow-lg: 0 4px 6px -2px rgb(16 24 40 / 0.03), 0 12px 16px -4px rgb(16 24 40 / 0.08);
      --shadow-xl: 0 20px 25px -5px rgb(16 24 40 / 0.10), 0 8px 10px -6px rgb(16 24 40 / 0.10);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--neutral-25);
      color: var(--neutral-900);
      font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .main-container {
      width: min(100%, 1280px);
      margin: 0 auto;
      padding-inline: 16px;
      padding-top: 32px;
      padding-bottom: 64px;
      display: grid;
      gap: 32px;
    }

    .main-container > * {
      max-width: 100%;
      min-width: 0;
    }

    @media (min-width: 640px) { .main-container { padding-inline: 24px; } }
    @media (min-width: 1024px) { .main-container { padding-inline: 32px; } }

    .section-title-row {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (min-width: 640px) {
      .section-title-row {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.4;
      color: var(--neutral-900);
      font-weight: 700;
    }

    .filters-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 200px;
    }

    .search-box input {
      width: 100%;
      height: 48px; /* HCI Touch Target minimum */
      padding: 0 36px 0 12px;
      border: 1px solid var(--neutral-300);
      border-radius: 8px;
      background: var(--neutral-0);
      color: var(--neutral-900);
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--brand-500);
      box-shadow: 0 0 0 4px rgba(27,131,84,0.1);
    }

    .search-box .icon-search {
      position: absolute;
      top: 14px;
      right: 12px;
      color: var(--neutral-500);
      pointer-events: none;
    }

    /* Table Styles */
    .card-table {
      background: var(--neutral-0);
      border: 1px solid var(--neutral-200);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      text-align: right;
    }

    thead th {
      background: var(--neutral-50);
      padding: 12px 24px;
      font-size: 12px;
      font-weight: 500;
      color: var(--neutral-600);
      border-bottom: 1px solid var(--neutral-200);
    }

    tbody td {
      padding: 16px 24px;
      border-bottom: 1px solid var(--neutral-200);
      vertical-align: middle;
    }

    .report-row {
      transition: background-color 0.2s;
      cursor: pointer;
    }

    .report-row:hover {
      background: var(--neutral-50);
    }

    .report-row:focus {
      outline: none;
      background: var(--brand-50);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 500;
    }

    .badge.success { background: var(--success-50); color: var(--success-700); }
    .badge.warning { background: var(--warning-50); color: var(--warning-700); }
    .badge.danger { background: var(--danger-50); color: var(--danger-700); }
    .badge.neutral { background: var(--neutral-100); color: var(--neutral-700); }

    .score-badge {
      font-family: 'Roboto Mono', monospace;
      font-weight: 600;
      font-size: 14px;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      text-align: center;
      min-width: 50px;
    }

    .score-high { background: var(--success-100); color: var(--success-700); }
    .score-medium { background: var(--warning-100); color: var(--warning-700); }
    .score-low { background: var(--danger-100); color: var(--danger-700); }

    .mono { font-family: 'Roboto Mono', monospace; }

    .empty-state {
      text-align: center;
      padding: 64px 20px;
    }

    .empty-state-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--neutral-500);
    }

    .empty-state-box svg {
      width: 48px;
      height: 48px;
      color: var(--neutral-300);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(22, 22, 22, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--neutral-0);
      border-radius: 12px;
      width: 100%;
      max-width: 800px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-xl);
      transform: translateY(20px) scale(0.98);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.open .modal {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--neutral-200);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: var(--neutral-0);
      z-index: 10;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 18px;
      color: var(--neutral-900);
      font-weight: 600;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--neutral-500);
      width: 48px; /* HCI Touch Target minimum */
      height: 48px; /* HCI Touch Target minimum */
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: var(--neutral-100);
      color: var(--neutral-900);
    }

    .modal-body {
      padding: 24px;
    }

    .report-details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .detail-card {
      background: var(--neutral-50);
      border: 1px solid var(--neutral-200);
      border-radius: 8px;
      padding: 16px;
    }

    .detail-label {
      font-size: 12px;
      color: var(--neutral-500);
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--neutral-900);
      word-break: break-word;
    }

    /* Criteria List */
    .criteria-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .criterion-item {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--neutral-200);
      border-radius: 8px;
      background: var(--neutral-0);
    }

    .criterion-item.missing {
      background: var(--neutral-50);
      border-style: dashed;
    }

    .criterion-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .criterion-title {
      font-weight: 600;
      font-size: 14px;
      color: var(--neutral-900);
    }

    .criterion-meta {
      font-size: 12px;
      color: var(--neutral-500);
    }

    .criterion-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      min-height: 48px; /* HCI Touch Target minimum */
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--brand-600);
      color: white;
      border-color: var(--brand-600);
    }

    .btn-primary:hover { background: var(--brand-700); }

    .btn-secondary {
      background: white;
      color: var(--neutral-700);
      border-color: var(--neutral-300);
    }
    
    .btn-secondary:hover { background: var(--neutral-50); }

    .btn-small {
      min-height: 32px;
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-secondary:hover {
      background: var(--neutral-50);
      color: var(--neutral-900);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      min-height: 48px; /* HCI Touch Target minimum */
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 32px;
      background: var(--neutral-900);
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-lg);
      transform: translateY(150%);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 999;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

  </style>
</head>
<body>

  <!-- Skip Link for Accessibility -->
  <a href="#main-content" class="skip-link">تخطي إلى المحتوى</a>

  <div id="emtithal-header"></div>

  <!-- Main Content -->
  <main id="main-content" class="main-container">
    <section>
      <div class="section-title-row">
        <h2>التقارير الآلية للمنصات الحكومية</h2>
        <div class="filters-bar">
          <div class="search-box">
            <span class="icon-search" data-icon="search"></span>
            <input type="text" id="searchInput" placeholder="ابحث بالرابط أو المعيار..." />
          </div>
          <button class="btn btn-secondary" onclick="loadReports()">
            <span data-icon="activity"></span> تحديث البيانات
          </button>
        </div>
      </div>
      
      <div class="card-table">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>رقم التقرير</th>
                <th>رابط المنصة</th>
                <th>مفتاح الجهة (API)</th>
                <th>تاريخ الفحص</th>
                <th>المعيار المفحوص</th>
                <th>نسبة الامتثال</th>
                <th>حالة التقرير</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- JS Populated -->
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- ─── Modal ─── -->
  <div class="modal-backdrop" id="report-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">تفاصيل التقرير <span class="mono" style="color:var(--neutral-500);font-size:14px;margin-right:8px" id="modal-subtitle"></span></h3>
        <button class="modal-close" type="button" data-close-modal aria-label="إغلاق" data-icon="x"></button>
      </div>
      <div class="modal-body">
        
        <div class="report-details-grid">
          <div class="detail-card">
            <div class="detail-label">رابط المنصة</div>
            <div class="detail-value mono" id="modal-url">---</div>
          </div>
          <div class="detail-card">
            <div class="detail-label">تاريخ الفحص</div>
            <div class="detail-value mono" id="modal-date">---</div>
          </div>
        </div>

        <h3 style="font-size:16px; margin-top: 0; margin-bottom: 16px;">موقف المنصة من معايير التصميم الموحد (55 معياراً)</h3>
        
        <div class="criteria-list" id="modal-criteria-list">
          <!-- Populated by JS -->
        </div>

      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span data-icon="check" aria-hidden="true"></span>
    <span id="toast-msg">رسالة</span>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/emtithal_components.js"></script>
  <script src="audit_reports.js"></script>

  <div id="emtithal-footer"></div>
</body>
</html>
