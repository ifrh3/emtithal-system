    left: 32px;
    bottom: 32px;

}

  }

  function loadExtensionsSupabaseSdk() {
    if (window.supabase?.createClient) return Promise.resolve(window.supabase);
    if (window.__emtithalSupabaseLoad) return window.__emtithalSupabaseLoad;

    window.__emtithalSupabaseLoad = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = EXTENSIONS_SUPABASE_CDN;
      script.async = true;
      script.onload = () => window.supabase?.createClient ? resolve(window.supabase) : reject(new Error('Supabase SDK loaded without createClient.'));

      document.head.appendChild(script);

    return window.__emtithalSupabaseLoad;

    if (window.db) return window.db;

    for (let attempt = 0; attempt < 20; attempt += 1) {
      if (window.ensureEmtithalSupabaseClient) return window.ensureEmtithalSupabaseClient();
      if (window.db) return window.db;
      if (window.supabase?.createClient) {

    window.db = window.supabase.createClient(EXTENSIONS_SUPABASE_URL, EXTENSIONS_SUPABASE_ANON);

    avatar:      `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
    star:        `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
    tooltip:     `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="12" y2="13"/></svg>`,
    input:       `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="8" width="20" height="8" rx="2"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="10" y1="10" x2="10" y2="14"/></svg>`,
    table:       `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="1"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="2" y1="16" x2="22" y2="16"/><line x1="8" y1="4" x2="8" y2="20"/><line x1="14" y1="4" x2="14" y2="20"/></svg>`,
    calendar:    `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
    sitemap:     `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><line x1="12" y1="7" x2="12" y2="12"/><line x1="5" y1="17" x2="5" y2="12"/><line x1="19" y1="17" x2="19" y2="12"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
    click:       `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 9V3a3 3 0 0 1 6 0v6"/><path d="M12 3a9 9 0 0 1 9 9 9 9 0 0 1-9 9H9A9 9 0 0 1 3 12V9h6"/></svg>`,
    language:    `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
    feedback:    `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
    shield:      `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
    text:        `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="18" y2="18"/></svg>`,
    error:       `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
    chromeExt:   `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19.5 12c-1.38 0-2.5-1.12-2.5-2.5 0-2.76-2.24-5-5-5-.84 0-1.63.21-2.31.57A3.5 3.5 0 0 1 7.5 7.5C6.12 7.5 5 8.62 5 10c0 1.25.82 2.3 1.94 2.47A4.98 4.98 0 0 0 7 14c0 2.76 2.24 5 5 5 .59 0 1.15-.1 1.67-.29A3.5 3.5 0 0 1 16.5 21c1.38 0 2.5-1.12 2.5-2.5 0-.82-.4-1.54-1-1.99V14.5c0-1.38 1.12-2.5 2.5-2.5Z"/></svg>`,
  };

  const CAT_CONFIG = {
    'اساسيات': { label: 'أساسات', iconClass: 'icon-blue', badgeClass: 'cat-اساسيات' },
    'قوالب': { label: 'قوالب', iconClass: 'icon-green', badgeClass: 'cat-قوالب' },
    'عناصر': { label: 'عناصر', iconClass: 'icon-purple', badgeClass: 'cat-عناصر' },
  };

  function escapeHTML(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function escapeAttr(value) {
    return escapeHTML(value);
  }

  function safeExternalUrl(value) {
    const raw = String(value ?? '').trim();
    if (!raw) return '';
    try {
      const parsed = new URL(raw.startsWith('http://') || raw.startsWith('https://') ? raw : `https://${raw}`);
      return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : '';
    } catch {
      return '';
    }
  }

  function parseSubItems(value) {
    if (Array.isArray(value)) return value;
    if (!value) return [];
    try {
      const parsed = typeof value === 'string' ? JSON.parse(value) : value;
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }

  function updateCounts(filtered) {
    document.getElementById('fc-all').textContent = EXTENSIONS.length;
    const bycat = {};
    EXTENSIONS.forEach(e => { bycat[e.cat] = (bycat[e.cat] || 0) + 1; });
    document.getElementById('fc-اساسيات').textContent = bycat['اساسيات'] || 0;
    document.getElementById('fc-قوالب').textContent   = bycat['قوالب']   || 0;
    document.getElementById('fc-عناصر').textContent   = bycat['عناصر']   || 0;
    resultsCount.textContent = filtered.length;
  }

  function renderCards() {
    const q = searchQuery.toLowerCase().trim();
    const filtered = EXTENSIONS.filter(ext => {
      const matchCat = activeFilter === 'all' || ext.cat === activeFilter;
      const matchQ   = !q || String(ext.title).toLowerCase().includes(q) || String(ext.desc).toLowerCase().includes(q) ||
                       (ext.subs || []).some(s => String(s).toLowerCase().includes(q));
      return matchCat && matchQ;
    });

    updateCounts(filtered);

    if (!filtered.length) {
      grid.innerHTML = '';
      emptyState.classList.remove('hidden');
      return;
    }
    emptyState.classList.add('hidden');
    grid.className = 'cards-grid' + (viewMode === 'list' ? ' list-view' : '');

    grid.innerHTML = filtered.map((ext, i) => {
      const cfg = CAT_CONFIG[ext.cat] || CAT_CONFIG['عناصر'];
      const icon = ICONS[ext.icon] || ICONS['dashboard'];
      const delay = Math.min(i * 30, 300);
      const extId = Number(ext.id);
      const extNum = Number(ext.num);
      const refUrl = safeExternalUrl(ext.link);
      const canDownload = [4, 11].includes(extNum); // Only enabled for extensions that have ZIP files
      // The normal renderer now handles both 4 and 11

      return `
        <article class="ext-card" style="animation-delay:${delay}ms"
          role="article" aria-labelledby="ext-title-${escapeAttr(ext.id)}"
          data-num="${escapeAttr(ext.num)}" data-cat="${escapeAttr(ext.cat)}">
          <div class="card-header">
            <div class="card-icon-wrap ${cfg.iconClass}">${icon}</div>
            <div class="card-meta">
              <div class="card-num">معيار #${escapeHTML(ext.num)}</div>
              <div class="card-title" id="ext-title-${escapeAttr(ext.id)}">${escapeHTML(ext.title)}</div>
              <p class="card-desc-inline">${escapeHTML(ext.desc)}</p>
            </div>
            <span class="cat-badge ${cfg.badgeClass}">${cfg.label}</span>
          </div>
          <div class="card-body">
            <p class="card-desc">${escapeHTML(ext.desc)}</p>
          </div>
          <div class="card-footer">
            <span class="cat-badge-list ${cfg.badgeClass}">${cfg.label}</span>
            ${refUrl
              ? `<a class="card-ext-badge" href="${escapeAttr(refUrl)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" title="عرض المعيار" aria-label="عرض معيار ${escapeAttr(ext.num)}: ${escapeAttr(ext.title)}">
                   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> عرض المعيار
                  </a>`
              : `<span class="card-no-link">—</span>`
            }
            ${canDownload ? `
              <button class="card-ext-badge-footer" type="button" onclick="incrementDownload(${extId}, '../Emtithal-Criterion${extNum}-Extension.zip')" title="تحميل إضافة كروم لهذا المعيار" style="text-decoration:none;">
                ${ICONS.chromeExt} تحميل الإضافة (ZIP)
              </button>
            ` : `
              <div class="card-ext-badge-footer" title="إضافة كروم قريباً لهذا المعيار" style="opacity: 0.6; cursor: not-allowed;">
                ${ICONS.chromeExt} الإضافة قريباً
              </div>
            `}
          </div>
        </article>
      `;
    }).join('');

    // no modal keyboard handler needed
  }

  // modal removed
  
  // --- Floating Scroll Button ---
  const fab = document.getElementById('extScrollFab');
  const fabPath = document.getElementById('extScrollFabPath');
  if (fab && fabPath) {
    const updateFab = () => {
      const scrolled = window.scrollY || document.documentElement.scrollTop;
      // If we've scrolled down more than 200px, point UP (to go back to top)
      // Otherwise, point DOWN (to go to bottom)
      if (scrolled > 200) {
        fab.setAttribute('aria-label', 'التمرير إلى الأعلى');
        fab.title = 'التمرير إلى الأعلى';
        fabPath.setAttribute('d', 'M12 5v14M5 12l7-7 7 7'); // Arrow up
      } else {
        fab.setAttribute('aria-label', 'التمرير إلى الأسفل');
        fab.title = 'التمرير إلى الأسفل';
        fabPath.setAttribute('d', 'M12 19V5M5 12l7 7 7-7'); // Arrow down
      }
    };
    
    window.addEventListener('scroll', updateFab, { passive: true });
    // Run after a short delay to ensure content is loaded
    setTimeout(updateFab, 100);

    fab.addEventListener('click', function() {
      const scrolled = window.scrollY || document.documentElement.scrollTop;
      if (scrolled > 200) {
        const behavior = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
        window.scrollTo({ top: 0, behavior }); // Scroll to top
      } else {
        const behavior = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
        window.scrollTo({ top: document.documentElement.scrollHeight, behavior }); // Scroll to bottom
      }
    });
  }

  // --- Initial Render ---
  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value;
    clearSearch.classList.toggle('hidden', !searchQuery);
    renderCards();
  });
  clearSearch.addEventListener('click', () => {
    searchInput.value = '';
    searchQuery = '';
    clearSearch.classList.add('hidden');
    searchInput.focus();
    renderCards();
  });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      activeFilter = btn.dataset.cat;
      renderCards();
    });
  });

  viewGrid.addEventListener('click', () => {
    viewMode = 'grid';
    viewGrid.classList.add('active');
    viewList.classList.remove('active');
    viewGrid.setAttribute('aria-pressed', 'true');
    viewList.setAttribute('aria-pressed', 'false');
    renderCards();
  });
  viewList.addEventListener('click', () => {
    viewMode = 'list';
    viewList.classList.add('active');
    viewGrid.classList.remove('active');
    viewList.setAttribute('aria-pressed', 'true');
    viewGrid.setAttribute('aria-pressed', 'false');
    renderCards();
  });

  window.resetAll = function () {
    activeFilter = 'all';
    searchQuery  = '';
    searchInput.value = '';
    clearSearch.classList.add('hidden');
    filterBtns.forEach(b => {
      b.classList.remove('active');
      b.setAttribute('aria-pressed', 'false');
    });
    const allFilter = document.querySelector('[data-cat="all"]');
    allFilter.classList.add('active');
    allFilter.setAttribute('aria-pressed', 'true');
    renderCards();
  };

  // Fetch Extensions from Supabase DB
  async function init() {
    let db;
    try {
      db = await ensureExtensionsDb();
    } catch (error) {
      console.error('Supabase client not initialized:', error);
      emptyState.innerHTML = '<p style="color:var(--pc-danger-500);text-align:center;">خطأ في الاتصال بقاعدة البيانات. الرجاء التأكد من ملفات الإعدادات.</p>';
      emptyState.classList.remove('hidden');
      return;
    }

    try {
      // Show loading
      grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--pc-neutral-500);">جاري تحميل الإضافات من قاعدة البيانات...</div>';
      
      const { data, error } = await db.from('extensions').select('*').order('num', { ascending: true });
      
      if (error) throw error;
      
      if (!data || data.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      
      // Map the DB structure back to our expected JS format
      EXTENSIONS = data.map(d => ({
        id: d.id,
        num: d.num,
        cat: d.cat,
        title: d.t_ar || 'بدون عنوان', 
        desc: d.desc_text || '', 
        link: d.link,
        downloads: d.downloads || 0,
        subs: parseSubItems(d.subs),
        icon: d.icon
      }));

      // Render the fetched data
      renderCards();
    } catch (e) {
      console.error('Error fetching extensions:', e);
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--pc-danger-500);">حدث خطأ أثناء تحميل البيانات: ${escapeHTML(e.message)}</div>`;
    }
  }

  init();

})();
  </script>
</body>
</html>
