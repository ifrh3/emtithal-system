<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إكستنشنات كود المنصات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/emtithal_public_components.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/emtithal_public_components.js" defer></script>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --pc-brand-50:#F3FCF6;
  --pc-brand-100:#DCFAE6;
  --pc-brand-200:#ABEFC6;
  --pc-brand-500:#1B8354;
  --pc-brand-600:#067647;
  --pc-brand-700:#14573A;
  --pc-neutral-0:#FFFFFF;
  --pc-neutral-25:#FCFCFD;
  --pc-neutral-50:#F9FAFB;
  --pc-neutral-100:#F3F4F6;
  --pc-neutral-200:#E5E7EB;
  --pc-neutral-300:#D2D6DB;
  --pc-neutral-400:#9DA4AE;
  --pc-neutral-500:#6C737F;
  --pc-neutral-600:#4D5761;
  --pc-neutral-700:#384250;
  --pc-neutral-800:#1F2A37;
  --pc-neutral-900:#161616;
  --pc-neutral-950:#0D121C;
  --pc-danger-50:#FEF3F2;
  --pc-danger-600:#B42318;
  --pc-warning-50:#FFFAEB;
  --pc-warning-200:#FEDF89;
  --pc-warning-700:#B54708;
  --pc-info-50:#F4EBFF;
  --pc-info-100:#E9D7FE;
  --pc-info-700:#5C16C5;
  --cat-foundations:#E5E500;
  --cat-templates:#E49EDD;
  --cat-components:#94DCF8;
  --cat-foundations-fg:#292900;
  --cat-templates-fg:#42143E;
  --cat-components-fg:#073545;
  --font:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius-sm:4px;
  --radius-md:8px;
  --radius-lg:12px;
  --radius-xl:16px;
  --radius-pill:9999px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
  --shadow-md:0 2px 4px rgba(16,24,40,.06),0 4px 8px rgba(16,24,40,.10);
  --shadow-lg:0 4px 6px rgba(16,24,40,.03),0 12px 16px rgba(16,24,40,.08);
  --ring-focus:0 0 0 4px rgba(27,131,84,.16);
  --transition:150ms cubic-bezier(.4,0,.2,1);
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--pc-neutral-25);
  color: var(--pc-neutral-900);
  direction: rtl;
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button, input { font: inherit; }
.container { width: min(100% - 48px, 1280px); margin-inline: auto; }
.hidden { display: none !important; }

body {
  display: flex;
  flex-direction: column;
}

#emtithal-footer {
  margin-top: auto;
}

.controls-bar {
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid var(--pc-neutral-200);
  padding-block: 16px;
  position: sticky;
  top: 72px;
  z-index: 90;
  backdrop-filter: blur(10px);
}
.controls-inner {
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
}
.search-wrap {
  position:relative;
  flex:1 1 320px;
  min-width:260px;
}
.search-icon {
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:var(--pc-neutral-500);
  pointer-events:none;
}
.search-input {
  width:100%;
  height:44px;
  padding:10px 42px 10px 40px;
  border:1px solid var(--pc-neutral-300);
  border-radius:var(--radius-sm);
  background:var(--pc-neutral-0);
  color:var(--pc-neutral-900);
  font-size:14px;
  line-height:20px;
  outline:none;
  transition:border-color var(--transition), box-shadow var(--transition), background var(--transition);
  direction:rtl;
}
.search-input:hover { border-color:var(--pc-neutral-400); }
.search-input:focus { border-color:var(--pc-brand-500); box-shadow:var(--ring-focus); }
.search-input::placeholder { color:var(--pc-neutral-500); }
.search-clear {
  position:absolute;
  left:10px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  cursor:pointer;
  color:var(--pc-neutral-500);
  width:28px;
  height:28px;
  border-radius:var(--radius-sm);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background var(--transition), color var(--transition);
}
.search-clear:hover { background:var(--pc-neutral-100); color:var(--pc-neutral-900); }

.filter-group { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.filter-btn {
  min-height:36px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 12px;
  border:1px solid var(--pc-neutral-300);
  border-radius:var(--radius-pill);
  background:var(--pc-neutral-0);
  color:var(--pc-neutral-700);
  font-size:13px;
  line-height:18px;
  font-weight:500;
  cursor:pointer;
  transition:background var(--transition), border-color var(--transition), color var(--transition), box-shadow var(--transition);
}
.filter-btn:hover { background:var(--pc-neutral-50); border-color:var(--pc-neutral-400); color:var(--pc-neutral-900); }
.filter-btn:focus-visible, .view-btn:focus-visible, .card-link:focus-visible, .card-ext-badge:focus-visible, .btn-reset:focus-visible, .modal-close:focus-visible, .btn-install-ext:focus-visible, .modal-ref-btn:focus-visible {
  outline:none;
  box-shadow:var(--ring-focus);
}
.filter-btn.active { background:var(--pc-brand-500); border-color:var(--pc-brand-500); color:var(--pc-neutral-0); }
.filter-btn[data-cat="اساسيات"].active { background:var(--cat-foundations); border-color:var(--cat-foundations); color:var(--cat-foundations-fg); }
.filter-btn[data-cat="قوالب"].active { background:var(--cat-templates); border-color:var(--cat-templates); color:var(--cat-templates-fg); }
.filter-btn[data-cat="عناصر"].active { background:var(--cat-components); border-color:var(--cat-components); color:var(--cat-components-fg); }
.filter-count {
  min-width:24px;
  text-align:center;
  background:var(--pc-neutral-100);
  color:var(--pc-neutral-600);
  font-size:11px;
  line-height:16px;
  font-weight:700;
  padding:1px 7px;
  border-radius:var(--radius-pill);
}
.filter-btn.active .filter-count { background:rgba(255,255,255,.32); color:currentColor; }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; border:1px solid rgba(13,18,28,.16); }
.dot-blue { background:var(--cat-foundations); }
.dot-green { background:var(--cat-templates); }
.dot-purple { background:var(--cat-components); }

.view-toggle {
  display:flex;
  border:1px solid var(--pc-neutral-300);
  border-radius:var(--radius-sm);
  overflow:hidden;
  background:var(--pc-neutral-0);
  margin-right:auto;
  height:36px;
}
.view-btn {
  width:38px;
  border:0;
  border-inline-start:1px solid var(--pc-neutral-200);
  background:var(--pc-neutral-0);
  color:var(--pc-neutral-500);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background var(--transition), color var(--transition);
}
.view-btn:first-child { border-inline-start:0; }
.view-btn:hover { background:var(--pc-neutral-50); color:var(--pc-neutral-800); }
.view-btn.active { background:var(--pc-brand-50); color:var(--pc-brand-700); }

.results-info {
  color:var(--pc-neutral-600);
  font-size:14px;
  line-height:20px;
  padding:20px 0 12px;
}
.results-info strong { color:var(--pc-neutral-950); font-weight:700; }

.cards-grid {
  display:grid;
  grid-template-columns:repeat(3, minmax(0,1fr));
  gap:16px;
  padding-bottom:72px;
}
.cards-grid.list-view { grid-template-columns:1fr; }
.ext-card {
  position:relative;
  display:flex;
  flex-direction:column;
  gap:16px;
  min-height:218px;
  background:var(--pc-neutral-0);
  border:1px solid var(--pc-neutral-300);
  border-radius:var(--radius-md);
  padding:16px;
  box-shadow:var(--shadow-sm);
  overflow:hidden;
  transition:transform var(--transition), border-color var(--transition), box-shadow var(--transition), background var(--transition);
  animation:fadeUp 240ms var(--transition) both;
}
.ext-card::before {
  content:"";
  position:absolute;
  inset-inline-start:0;
  top:0;
  bottom:0;
  width:4px;
  background:var(--pc-brand-500);
  opacity:.95;
}
.ext-card[data-cat="اساسيات"]::before { background:var(--cat-foundations); }
.ext-card[data-cat="قوالب"]::before { background:var(--cat-templates); }
.ext-card[data-cat="عناصر"]::before { background:var(--cat-components); }
.ext-card:hover { transform:translateY(-2px); border-color:var(--pc-brand-500); box-shadow:var(--shadow-md); }
.ext-card:focus-visible { outline:none; box-shadow:var(--ring-focus), var(--shadow-sm); }
@keyframes fadeUp { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }

.card-header { display:flex; align-items:flex-start; gap:12px; min-width:0; }
.card-icon-wrap {
  width:44px;
  height:44px;
  border-radius:var(--radius-md);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  border:1px solid rgba(13,18,28,.12);
}
.card-icon-wrap svg { width:22px; height:22px; }
.icon-blue { background:var(--cat-foundations); color:var(--cat-foundations-fg); }
.icon-green { background:var(--cat-templates); color:var(--cat-templates-fg); }
.icon-purple { background:var(--cat-components); color:var(--cat-components-fg); }
.icon-amber { background:var(--pc-warning-50); color:var(--pc-warning-700); }
.card-meta { flex:1; min-width:0; }
.card-num { color:var(--pc-neutral-500); font-size:12px; line-height:18px; margin-bottom:2px; }
.card-title { color:var(--pc-neutral-950); font-size:16px; line-height:24px; font-weight:700; }
.card-desc-inline { display:none; color:var(--pc-neutral-600); font-size:13px; line-height:20px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-body { flex:1; }
.card-desc {
  color:var(--pc-neutral-600);
  font-size:14px;
  line-height:24px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.card-footer {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  border-top:1px solid var(--pc-neutral-200);
  padding-top:12px;
  margin-top:auto;
  flex-direction:row-reverse;
}
.cat-badge, .cat-badge-list, .modal-cat-badge {
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  line-height:18px;
  font-weight:700;
  padding:3px 10px;
  border-radius:var(--radius-pill);
  border:1px solid rgba(13,18,28,.12);
  white-space:nowrap;
}
.cat-badge-list { display:none; }
.cat-اساسيات { background:var(--cat-foundations); color:var(--cat-foundations-fg); }
.cat-قوالب { background:var(--cat-templates); color:var(--cat-templates-fg); }
.cat-عناصر { background:var(--cat-components); color:var(--cat-components-fg); }
.cat-اساسيات.cat-badge-list { background:var(--cat-foundations); color:var(--cat-foundations-fg); }
.cat-قوالب.cat-badge-list { background:var(--cat-templates); color:var(--cat-templates-fg); }
.cat-عناصر.cat-badge-list { background:var(--cat-components); color:var(--cat-components-fg); }
.card-link, .card-ext-badge, a.card-ext-badge, .card-ext-badge-footer {
  min-height:32px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-decoration:none;
  border-radius:var(--radius-sm);
  font-size:12px;
  line-height:18px;
  font-weight:700;
  transition:background var(--transition), border-color var(--transition), color var(--transition), box-shadow var(--transition);
}
.card-link, .card-ext-badge, a.card-ext-badge {
  padding:6px 10px;
  color:var(--pc-brand-700);
  background:var(--pc-brand-50);
  border:1px solid var(--pc-brand-200);
}
.card-link:hover, .card-ext-badge:hover { background:var(--pc-brand-100); border-color:var(--pc-brand-500); color:var(--pc-brand-700); }
.card-link svg, .card-ext-badge svg { width:14px; height:14px; }
.card-ext-badge-footer {
  padding:6px 10px;
  background:var(--pc-neutral-950);
  color:var(--pc-neutral-0);
  border:1px solid var(--pc-neutral-950);
  cursor:pointer;
}
.card-ext-badge-footer:hover { background:var(--pc-neutral-800); border-color:var(--pc-neutral-800); }
.card-ext-badge-footer svg { width:14px; height:14px; }
.card-no-link { color:var(--pc-neutral-400); font-size:13px; line-height:20px; }

.cards-grid.list-view .ext-card {
  min-height:auto;
  flex-direction:row;
  align-items:center;
  gap:16px;
  padding:14px 16px;
}
.cards-grid.list-view .card-header { flex:1; align-items:center; min-width:0; }
.cards-grid.list-view .card-meta { display:flex; flex-direction:column; gap:1px; }
.cards-grid.list-view .card-title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cards-grid.list-view .card-desc-inline { display:block; }
.cards-grid.list-view .card-body { display:none; }
.cards-grid.list-view .card-footer { flex-shrink:0; margin-top:0; padding-top:0; border-top:0; flex-direction:row; justify-content:flex-start; }
.cards-grid.list-view .card-header .cat-badge { display:none; }
.cards-grid.list-view .cat-badge-list { display:inline-flex; }
.cards-grid:not(.list-view) .card-footer .cat-badge { display:none; }
.cards-grid:not(.list-view) .cat-badge-list { display:none; }

.empty-state { text-align:center; padding:80px 24px 96px; }
.empty-icon { width:64px; height:64px; border-radius:var(--radius-pill); display:flex; align-items:center; justify-content:center; color:var(--pc-neutral-500); background:var(--pc-neutral-100); margin:0 auto 16px; }
.empty-title { color:var(--pc-neutral-950); font-size:20px; line-height:30px; font-weight:700; margin-bottom:6px; }
.empty-sub { color:var(--pc-neutral-600); font-size:14px; line-height:24px; margin-bottom:20px; }
.btn-reset {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:40px;
  padding:8px 16px;
  border:1px solid var(--pc-brand-500);
  border-radius:var(--radius-sm);
  background:var(--pc-brand-500);
  color:var(--pc-neutral-0);
  font-size:14px;
  line-height:20px;
  font-weight:700;
  cursor:pointer;
  transition:background var(--transition), border-color var(--transition), box-shadow var(--transition);
}
.btn-reset:hover { background:var(--pc-brand-600); border-color:var(--pc-brand-600); }

.modal-overlay {
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(13,18,28,.56);
  backdrop-filter:blur(4px);
  animation:fadeIn 150ms ease both;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal-box {
  width:min(100%, 640px);
  max-height:90vh;
  overflow:auto;
  position:relative;
  background:var(--pc-neutral-0);
  border:1px solid var(--pc-neutral-200);
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow-lg);
  padding:32px;
  animation:slideUp 180ms ease both;
}
@keyframes slideUp { from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1} }
.modal-close {
  position:absolute;
  top:20px;
  left:20px;
  width:36px;
  height:36px;
  border:1px solid var(--pc-neutral-300);
  border-radius:var(--radius-sm);
  background:var(--pc-neutral-0);
  color:var(--pc-neutral-600);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background var(--transition), color var(--transition), border-color var(--transition);
}
.modal-close:hover { background:var(--pc-neutral-100); color:var(--pc-neutral-950); }
.modal-num { color:var(--pc-neutral-500); font-size:12px; line-height:18px; margin:14px 0 6px; }
.modal-title { color:var(--pc-neutral-950); font-size:24px; line-height:32px; font-weight:700; margin-bottom:12px; }
.modal-desc-full { color:var(--pc-neutral-700); font-size:15px; line-height:26px; margin-bottom:24px; }
.modal-extension-box {
  background:var(--pc-neutral-50);
  border:1px dashed var(--pc-neutral-300);
  border-radius:var(--radius-md);
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:24px;
}
.modal-ext-info { display:flex; align-items:center; gap:12px; flex:1; }
.modal-ext-icon {
  width:44px;
  height:44px;
  border-radius:var(--radius-md);
  background:var(--pc-neutral-0);
  border:1px solid var(--pc-neutral-300);
  color:var(--pc-neutral-800);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.modal-ext-icon svg { width:22px; height:22px; }
.modal-ext-text h4 { color:var(--pc-neutral-950); font-size:14px; line-height:20px; font-weight:700; margin-bottom:2px; }
.modal-ext-text p { color:var(--pc-neutral-600); font-size:13px; line-height:20px; }
.btn-install-ext {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:40px;
  padding:8px 14px;
  background:var(--pc-neutral-950);
  color:var(--pc-neutral-0);
  border:1px solid var(--pc-neutral-950);
  border-radius:var(--radius-sm);
  font-size:13px;
  line-height:20px;
  font-weight:700;
  cursor:pointer;
  transition:background var(--transition), border-color var(--transition);
}
.btn-install-ext:hover { background:var(--pc-neutral-800); border-color:var(--pc-neutral-800); }
.btn-install-ext svg { width:16px; height:16px; }
.modal-section { margin-bottom:20px; }
.modal-section-title { color:var(--pc-neutral-500); font-size:12px; line-height:18px; font-weight:700; margin-bottom:10px; }
.modal-sub-list { list-style:none; display:flex; flex-direction:column; gap:8px; }
.modal-sub-list li { display:flex; gap:10px; align-items:flex-start; color:var(--pc-neutral-700); font-size:14px; line-height:24px; }
.modal-sub-list li::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--pc-brand-500); flex-shrink:0; margin-top:9px; }
.modal-ref-btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:40px;
  padding:8px 16px;
  background:var(--pc-brand-500);
  color:var(--pc-neutral-0);
  border-radius:var(--radius-sm);
  font-size:14px;
  line-height:20px;
  font-weight:700;
  text-decoration:none;
  transition:background var(--transition), box-shadow var(--transition);
}
.modal-ref-btn:hover { background:var(--pc-brand-600); }
.modal-ref-btn svg { width:14px; height:14px; }

.site-footer {
  background:var(--pc-neutral-950);
  border-top:1px solid rgba(255,255,255,.08);
  padding:24px 0;
}
.footer-inner { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
.footer-copy { color:rgba(255,255,255,.72); font-size:13px; line-height:20px; }
.footer-link { color:#ABEFC6; font-size:13px; line-height:20px; text-decoration:none; }
.footer-link:hover { text-decoration:underline; }

@media (max-width: 1120px) { .cards-grid { grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (max-width: 768px) {
  .container, .nav-inner { width:min(100% - 32px, 1280px); }
  .nav-inner { min-height:64px; }
  .controls-bar { top:64px; }
  .controls-inner { align-items:stretch; gap:12px; }
  .search-wrap { min-width:100%; flex-basis:100%; }
  .filter-group { width:100%; overflow-x:auto; flex-wrap:nowrap; padding-bottom:2px; scrollbar-width:thin; }
  .filter-btn { flex-shrink:0; }
  .view-toggle { margin-right:0; align-self:flex-end; }
  .cards-grid { grid-template-columns:1fr; gap:12px; padding-bottom:48px; }
  .cards-grid.list-view .ext-card { flex-direction:column; align-items:stretch; }
  .cards-grid.list-view .card-footer { justify-content:space-between; flex-wrap:wrap; }
  .modal-box { padding:24px; }
  .modal-extension-box { flex-direction:column; align-items:stretch; }
  .btn-install-ext { width:100%; }
}
@media (max-width: 520px) {
  .footer-inner { align-items:flex-start; flex-direction:column; }
  .card-header { align-items:flex-start; }
  .card-footer { flex-wrap:wrap; }
  .cat-badge { order:-1; }
}

    chromeExt:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19.5 12c-1.38 0-2.5-1.12-2.5-2.5 0-2.76-2.24-5-5-5-.84 0-1.63.21-2.31.57A3.5 3.5 0 0 1 7.5 7.5C6.12 7.5 5 8.62 5 10c0 1.25.82 2.3 1.94 2.47A4.98 4.98 0 0 0 7 14c0 2.76 2.24 5 5 5 .59 0 1.15-.1 1.67-.29A3.5 3.5 0 0 1 16.5 21c1.38 0 2.5-1.12 2.5-2.5 0-.82-.4-1.54-1-1.99V14.5c0-1.38 1.12-2.5 2.5-2.5Z"/></svg>`,
  };

  const CAT_CONFIG = {
    'اساسيات': { label: 'أساسات', iconClass: 'icon-blue', badgeClass: 'cat-اساسيات' },
    'قوالب': { label: 'قوالب', iconClass: 'icon-green', badgeClass: 'cat-قوالب' },
    'عناصر': { label: 'عناصر', iconClass: 'icon-purple', badgeClass: 'cat-عناصر' },
  };

  function updateCounts(filtered) {
    document.getElementById('fc-all').textContent = EXTENSIONS.length;
    const bycat = {};
    EXTENSIONS.forEach(e => { bycat[e.cat] = (bycat[e.cat] || 0) + 1; });
    document.getElementById('fc-اساسيات').textContent = bycat['اساسيات'] || 0;
    document.getElementById('fc-قوالب').textContent   = bycat['قوالب']   || 0;
    document.getElementById('fc-عناصر').textContent   = bycat['عناصر']   || 0;
    resultsCount.textContent = filtered.length;
  }

  function renderCards() {
    const q = searchQuery.toLowerCase().trim();
    const filtered = EXTENSIONS.filter(ext => {
      const matchCat = activeFilter === 'all' || ext.cat === activeFilter;
      const matchQ   = !q || ext.title.includes(q) || ext.desc.includes(q) ||
                       (ext.subs || []).some(s => s.includes(q));
      return matchCat && matchQ;
    });

    updateCounts(filtered);

    if (!filtered.length) {
      grid.innerHTML = '';
      emptyState.classList.remove('hidden');
      return;
    }
    emptyState.classList.add('hidden');
    grid.className = 'cards-grid' + (viewMode === 'list' ? ' list-view' : '');

    grid.innerHTML = filtered.map((ext, i) => {
      const cfg = CAT_CONFIG[ext.cat];
      const icon = ICONS[ext.icon] || ICONS['dashboard'];
      const delay = Math.min(i * 30, 300);
      return `
        <article class="ext-card" style="animation-delay:${delay}ms"
          tabindex="0" role="article" aria-label="${ext.title}"
          data-num="${ext.num}" data-cat="${ext.cat}">
          <div class="card-header">
            <div class="card-icon-wrap ${cfg.iconClass}">${icon}</div>
            <div class="card-meta">
              <div class="card-num">معيار #${ext.num}</div>
              <div class="card-title">${ext.title}</div>
              <p class="card-desc-inline">${ext.desc}</p>
            </div>
            <span class="cat-badge ${cfg.badgeClass}">${cfg.label}</span>
          </div>
          <div class="card-body">
            <p class="card-desc">${ext.desc}</p>
          </div>
          <div class="card-footer">
            <span class="cat-badge-list ${cfg.badgeClass}">${cfg.label}</span>
            ${ext.link
              ? `<a class="card-ext-badge" href="${ext.link}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" title="عرض المعيار">
                   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> عرض المعيار
                 </a>`
              : `<span class="card-no-link">—</span>`
            }
            ${ext.num === 4 || ext.num === '4' ? `
              <a class="card-ext-badge-footer" href="../Emtithal-Criterion4-Extension.zip" download="Emtithal-Criterion4-Extension.zip" title="تحميل إضافة كروم لهذا المعيار" style="text-decoration:none;">
                ${ICONS.chromeExt} تحميل الإضافة (ZIP)
              </a>
            ` : `
              <div class="card-ext-badge-footer" title="إضافة كروم قريباً لهذا المعيار" style="opacity: 0.6; cursor: not-allowed;">
                ${ICONS.chromeExt} الإضافة قريباً
              </div>
            `}
          </div>
        </article>
      `;
    }).join('');

    // no modal keyboard handler needed
  }

  // modal removed

  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value;
    clearSearch.classList.toggle('hidden', !searchQuery);
    renderCards();
  });
  clearSearch.addEventListener('click', () => {
    searchInput.value = '';
    searchQuery = '';
    clearSearch.classList.add('hidden');
    searchInput.focus();
    renderCards();
  });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.cat;
      renderCards();
    });
  });

  viewGrid.addEventListener('click', () => {
    viewMode = 'grid';
    viewGrid.classList.add('active');
    viewList.classList.remove('active');
    renderCards();
  });
  viewList.addEventListener('click', () => {
    viewMode = 'list';
    viewList.classList.add('active');
    viewGrid.classList.remove('active');
    renderCards();
  });

  window.resetAll = function () {
    activeFilter = 'all';
    searchQuery  = '';
    searchInput.value = '';
    clearSearch.classList.add('hidden');
    filterBtns.forEach(b => b.classList.remove('active'));
    document.querySelector('[data-cat="all"]').classList.add('active');
    renderCards();
  };

  // Fetch Extensions from Supabase DB
  async function init() {
    if (!window.db) {
      console.error('Supabase client not initialized');
      emptyState.innerHTML = '<p style="color:var(--pc-danger-500);text-align:center;">خطأ في الاتصال بقاعدة البيانات. الرجاء التأكد من ملفات الإعدادات.</p>';
      emptyState.classList.remove('hidden');
      return;
    }

    try {
      // Show loading
      grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--pc-neutral-500);">جاري تحميل الإضافات من قاعدة البيانات...</div>';
      
      const { data, error } = await window.db.from('extensions').select('*').order('num', { ascending: true });
      
      if (error) throw error;
      
      if (!data || data.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      
      // Map the DB structure back to our expected JS format
      EXTENSIONS = data.map(d => ({
        num: d.num,
        cat: d.cat,
        title: d.t_ar || 'بدون عنوان', 
        desc: d.desc_text || '', 
        link: d.link,
        subs: d.subs ? (typeof d.subs === 'string' ? JSON.parse(d.subs) : d.subs) : [],
        icon: d.icon
      }));

      // Render the fetched data
      renderCards();
    } catch (e) {
      console.error('Error fetching extensions:', e);
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--pc-danger-500);">حدث خطأ أثناء تحميل البيانات: ${e.message}</div>`;
    }
  }

  setTimeout(init, 100); // Allow Supabase to init first

})();
  </script>
</body>
</html>
